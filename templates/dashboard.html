<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crypto Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0d1b2a;
      --card-color: #1e293b;
      --text-color: #ffffff;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-color: #ffffff;
      --text-color: #0f172a;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
      transition: background-color 0.3s, color 0.3s;
    }

    .card {
      background-color: var(--card-color);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, background-color 0.3s, color 0.3s;
      color: var(--text-color);
    }

    .card:hover {
      transform: scale(1.015);
    }

    .card h5 {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .card p {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .text-success {
      color: #4ade80 !important;
    }

    .text-danger {
      color: #f87171 !important;
    }

    .text-info {
      color: #60a5fa !important;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
    }

    .btn-back {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
    }

    .btn-back:hover {
      background-color: #60a5fa;
    }

    /* Toggle Switch */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      z-index: 999;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      margin-left: 10px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "🌙";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
      text-align: center;
      line-height: 20px;
      font-size: 12px;
    }

    input:checked + .slider {
      background-color: #4ade80;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
      content: "☀️";
    }

  </style>
</head>
<body>

  <!-- Toggle Switch -->
  <div class="theme-toggle">
    <label class="switch">
      <input type="checkbox" id="modeToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="container">
    <div class="header">
      <h1><i class="fas fa-chart-line text-info"></i> Crypto Trend Dashboard</h1>
      <a href="/" class="btn btn-back"><i class="fas fa-home"></i> Home</a>
    </div>

    <div class="row g-4">
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <h5><i class="fas fa-coins text-info"></i> Total Cryptocurrencies Tracked</h5>
          <p>{{ stats.total_coins }}</p>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <h5><i class="fas fa-clock text-info"></i> Last Price Update</h5>
          <p>{{ stats.latest_price_update }}</p>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <h5><i class="fas fa-arrow-up text-success"></i> Top Gainer</h5>
          <p class="text-success">{{ stats.top_gainer }}</p>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <h5><i class="fas fa-arrow-down text-danger"></i> Top Loser</h5>
          <p class="text-danger">{{ stats.top_loser }}</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggle = document.getElementById('modeToggle');

    // Apply saved theme on load
    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
      toggle.checked = saved === "light";
    });

    // Toggle theme
    toggle.addEventListener("change", () => {
      const newTheme = toggle.checked ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem("theme", newTheme);
    });
  </script>

</body>
</html>
