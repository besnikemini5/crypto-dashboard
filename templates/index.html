<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crypto Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      --card-bg: rgba(255, 255, 255, 0.08);
      --text-color: white;
      --btn-bg: #4a90e2;
      --btn-hover: #3a78c2;
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(to right, #ffffff, #e2e8f0);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-color: #0f172a;
      --btn-bg: #2563eb;
      --btn-hover: #1d4ed8;
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Segoe UI', sans-serif;
      color: var(--text-color);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease-in-out;
    }

    .glass-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      text-align: center;
      width: 100%;
      max-width: 480px;
    }

    .btn-custom {
      background-color: var(--btn-bg);
      color: white;
      border-radius: 30px;
      padding: 12px 25px;
      font-weight: 500;
      border: none;
      margin-bottom: 15px;
      transition: 0.3s;
    }

    .btn-custom:hover {
      background-color: var(--btn-hover);
    }

    /* Toggle Switch */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      z-index: 999;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "🌙";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
      text-align: center;
      line-height: 20px;
      font-size: 12px;
    }

    input:checked + .slider {
      background-color: #4ade80;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
      content: "☀️";
    }
  </style>
</head>
<body>

  <!-- Toggle -->
  <div class="theme-toggle">
    <label class="switch">
      <input type="checkbox" id="modeToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="glass-card">
    <h1 class="mb-4">💹 Crypto Trend App</h1>
    <a href="/dashboard" class="btn btn-custom w-100">📊 Crypto Trend Dashboard</a><br>
    <a href="/live" class="btn btn-custom w-100">🌐 Live Prices</a><br>
    <a href="/candles" class="btn btn-custom w-100">📈 Candlestick Charts</a>
    <a href="/news" class="btn btn-custom w-100">📰 Crypto News Feed</a>
  </div>

  <script>
    const toggle = document.getElementById('modeToggle');
    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
      toggle.checked = saved === "light";
    });

    toggle.addEventListener("change", () => {
      const newTheme = toggle.checked ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem("theme", newTheme);
    });
  </script>
</body>
</html>
