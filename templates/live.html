<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Prices</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #0f2027, #203a43, #2c5364);
      --card-bg: rgba(255, 255, 255, 0.08);
      --text-main: #f5f5f5;
      --title-color: #00e6e6;
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(to right, #ffffff, #e0e0e0);
      --card-bg: #ffffff;
      --text-main: #111827;
      --title-color: #0ea5e9;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Segoe UI', sans-serif;
      padding: 50px;
      transition: all 0.3s ease-in-out;
    }

    h1 {
      text-shadow: 1px 1px 2px black;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      color: var(--title-color);
      font-size: 1.3rem;
      font-weight: 600;
    }

    .card-text {
      font-size: 2rem;
      font-weight: bold;
      color: var(--text-main);
      text-shadow: 0 0 5px rgba(0,255,255,0.2);
    }

    .btn-outline-light {
      border-radius: 30px;
    }

    /* Toggle Switch */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      z-index: 999;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "🌙";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
      text-align: center;
      line-height: 20px;
      font-size: 12px;
    }

    input:checked + .slider {
      background-color: #4ade80;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
      content: "☀️";
    }
  </style>
</head>
<body>

  <!-- Toggle -->
  <div class="theme-toggle">
    <label class="switch">
      <input type="checkbox" id="modeToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="container">
    <h1 class="mb-4">🌐 Live Crypto Prices</h1>
    <div class="row">
      {% for coin in prices %}
      <div class="col-md-3 mb-4">
        <div class="card p-3 text-center">
          <h4 class="card-title">{{ coin.name }}</h4>
          <p class="card-text">${{ coin.price }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
    <a href="/" class="btn btn-outline-light mt-4">← Back to Home</a>
  </div>

  <script>
    const toggle = document.getElementById('modeToggle');
    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
      toggle.checked = saved === "light";
    });

    toggle.addEventListener("change", () => {
      const newTheme = toggle.checked ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem("theme", newTheme);
    });
  </script>
</body>
</html>
